
name: motora
description: "Discover. Compare. Drive."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.5.3
  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Existing packages
  cupertino_icons: ^1.0.8
  dropdown_button2: ^2.3.9
  image_picker: ^1.1.2
  image: ^4.5.4
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/logo.png"
  min_sdk_android: 21

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/
    - assets/logo/
